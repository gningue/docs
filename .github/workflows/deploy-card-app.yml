name: Déployer les cartes de visite (GitHub Pages)

# Met en ligne gratuitement l'application card-app/ sur GitHub Pages.
# Activez d'abord : Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "card-app/**"
      - ".github/workflows/deploy-card-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer le contenu à publier
        run: |
          mkdir -p _site
          cp -r card-app/* _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
